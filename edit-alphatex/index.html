<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaTex Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/alphaTab.js"></script>
    <script src="https://kit.fontawesome.com/5e2ea50ecc.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
        }

        .editor-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-header {
            flex: 0 0 auto;
            background: #436d9d;
            color: #fff;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border-bottom: 1px solid #354a74;
        }

        .editor-header h1 {
            font-size: 1.25rem;
            margin: 0;
        }

        .editor-header-actions {
            display: flex;
            gap: 0.5rem;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .editor-content {
            flex: 1;
            display: flex;
            overflow: hidden;
            gap: 1px;
            background: #ddd;
        }

        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            overflow: hidden;
        }

        .panel-header {
            flex: 0 0 auto;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
        }

        .panel-content {
            flex: 1;
            overflow: auto;
        }

        /* Editor Side */
        .editor-side .panel-content {
            padding: 1rem;
        }

        #alphaTex-input {
            width: 100%;
            height: 100%;
            padding: 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: none;
            overflow: auto;
        }

        #alphaTex-input:focus {
            outline: none;
            border-color: #436d9d;
            box-shadow: 0 0 0 3px rgba(67, 109, 157, 0.1);
        }

        /* Preview Side */
        .preview-side {
            flex-direction: column;
        }

        .preview-controls {
            flex: 0 0 auto;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            padding: 0.75rem 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .preview-controls button {
            background: #436d9d;
            border: none;
            color: #fff;
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            transition: background 0.2s;
        }

        .preview-controls button:hover {
            background: #354a74;
        }

        .preview-controls button i {
            font-size: 0.875rem;
        }

        .preview-container {
            flex: 1;
            overflow: auto;
            padding: 1rem;
            background: #fafafa;
        }

        .at-viewport {
            width: 100%;
            height: 100%;
        }

        .at-main {
            width: 100%;
            position: relative;
        }

        .at-cursors {
            z-index: 1000 !important;
            pointer-events: none !important;
        }

        .at-cursor-bar {
            background: rgba(255, 242, 0, 0.25);
        }

        .at-cursor-beat {
            background: rgba(64, 64, 255, 0.75);
            width: 3px;
        }

        .at-selection {
            opacity: 0.1 !important;
        }

        .error-message {
            background: #fee;
            border: 1px solid #f99;
            border-radius: 4px;
            padding: 1rem;
            color: #c00;
            font-size: 0.875rem;
            margin: 1rem;
        }

        .status-bar {
            flex: 0 0 auto;
            background: #f0f0f0;
            border-top: 1px solid #ddd;
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-item {
            display: flex;
            gap: 0.25rem;
            align-items: center;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }

        .status-indicator.error {
            background: #ef4444;
        }

        .status-indicator.loading {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 1024px) {
            .editor-content {
                flex-direction: column;
            }

            .editor-panel {
                min-height: 50%;
            }
        }

        @media (max-width: 640px) {
            .editor-header {
                flex-direction: column;
                align-items: flex-start;
                padding: 0.75rem 1rem;
            }

            .editor-header h1 {
                font-size: 1rem;
            }

            .editor-header-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .preview-controls {
                flex-wrap: wrap;
                gap: 0.25rem;
            }

            .preview-controls button {
                padding: 0.4rem 0.6rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <!-- Header -->
        <div class="editor-header">
            <h1><i class="fas fa-music"></i> AlphaTex Editor</h1>
            <div class="editor-header-actions">
                <button class="header-btn" id="load-example" title="Load example">
                    <i class="fas fa-file-import"></i> Example
                </button>
                <button class="header-btn" id="clear-editor" title="Clear all">
                    <i class="fas fa-trash"></i> Clear
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="editor-content">
            <!-- Editor Panel -->
            <div class="editor-panel editor-side">
                <div class="panel-header">
                    <i class="fas fa-code"></i> AlphaTex Notation
                </div>
                <div class="panel-content">
                    <textarea id="alphaTex-input" placeholder="Enter AlphaTex notation here...&#10;&#10;Example:&#10;&#10;\\title &quot;My Song&quot;&#10;\\tempo 100&#10;.&#10;\\track &quot;Guitar&quot;&#10;\\instrument acoustic-guitar-steel&#10;:8 1.6 2.6 3.6 | :8 1.5 2.5 3.5 |">:8 38  :8 38  :8 38  :8 38  :8 38  :8 47  :8 38  :8 38 |  :32 38  :32 38  :16 38  :16 47  :16 38  :32 38  :32 38  :16 38  :8 47  :32 38  :32 38  :16 38  :16 48  :16 38  :32 38  :32 38  :16 48  48</textarea>
                </div>
            </div>

            <!-- Preview Panel -->
            <div class="editor-panel preview-side">
                <div class="panel-header">
                    <i class="fas fa-eye"></i> Preview
                </div>
                <div class="preview-controls">
                    <button id="render-btn" title="Render preview">
                        <i class="fas fa-play"></i> Render
                    </button>
                    <button id="play-btn" title="Play notation" disabled>
                        <i class="fas fa-music"></i> Play
                    </button>
                    <button id="stop-btn" title="Stop playback" disabled>
                        <i class="fas fa-stop"></i> Stop
                    </button>
                    <button id="loop-btn" title="Toggle loop">
                        <i class="fas fa-redo"></i> Loop
                    </button>
                </div>
                <div class="preview-container">
                    <div id="alphatab-container" class="at-viewport">
                        <div class="at-main"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <div class="status-indicator" id="status-indicator"></div>
                <span id="status-text">Ready</span>
            </div>
            <div class="status-item">
                <span id="char-count">0 characters</span>
            </div>
        </div>
    </div>

    <script src="editor.js"></script>
</body>
</html>
