<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Music - Lesson</title>
    <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/alphaTab.js"></script>
    <script src="https://kit.fontawesome.com/5e2ea50ecc.js" crossorigin="anonymous"></script>
    
    <!-- Data managers -->
    <script src="js/data-manager.js"></script>
    <script src="js/course-manager.js"></script>
    <script src="js/lesson-manager.js"></script>
    <script src="js/progress-tracker.js"></script>
    <script src="js/alphatab-renderer.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            font-size: 13px;
            background: #f5f5f5;
        }

        .lesson-wrap {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
        }

        .lesson-header {
            flex: 0 0 auto;
            padding: 1rem 1.5rem;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .lesson-header-info {
            flex: 1;
        }

        .lesson-header h1 {
            font-size: 1.5rem;
            color: #111;
            margin-bottom: 0.25rem;
        }

        .lesson-header-meta {
            font-size: 0.875rem;
            color: #666;
        }

        .lesson-header-actions {
            display: flex;
            gap: 0.5rem;
        }

        .lesson-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .at-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .at-main {
            width: 100%;
        }

        /* Player controls */
        .lesson-controls {
            flex: 0 0 auto;
            background: #436d9d;
            color: #fff;
            padding: 0.75rem 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            border-top: 1px solid #354a74;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-btn {
            background: none;
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            font-size: 16px;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .control-btn:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .control-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .control-btn.disabled:hover {
            background: none;
        }

        .control-btn.active {
            background: rgba(255, 255, 255, 0.2);
        }

        .lesson-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.875rem;
        }

        .lesson-progress {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-slider {
            flex: 0 0 150px;
            height: 6px;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
        }

        .control-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        .control-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            border: none;
            cursor: pointer;
        }

        .control-slider::-moz-range-track {
            background: transparent;
            border: none;
        }

        .close-btn {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 1.25rem;
            padding: 0.25rem;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .lesson-meta {
            display: flex;
            gap: 2rem;
            margin-left: auto;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
        }

        .meta-label {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .meta-value {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .complete-badge {
            display: inline-block;
            background: #10b981;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .lesson-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .lesson-header h1 {
                font-size: 1.25rem;
            }

            .lesson-controls {
                flex-wrap: wrap;
                padding: 0.5rem;
                gap: 0.5rem;
            }

            .lesson-info {
                order: 3;
                flex-basis: 100%;
                margin-top: 0.5rem;
            }

            .lesson-meta {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="lesson-wrap">
        <!-- Header -->
        <div class="lesson-header">
            <div class="lesson-header-info">
                <h1 id="lesson-title">Loading...</h1>
                <div class="lesson-header-meta">
                    <span id="course-name">Course: Loading...</span>
                </div>
            </div>
            <div class="lesson-meta">
                <div class="meta-item">
                    <div class="meta-label">Status</div>
                    <div id="lesson-status-badge" class="meta-value">-</div>
                </div>
            </div>
            <button class="close-btn" onclick="window.close(); return false;">✕</button>
        </div>

        <!-- Content (Music sheet) -->
        <div class="lesson-content">
            <div class="at-viewport">
                <div id="lesson-alphatab" class="at-main"></div>
            </div>
        </div>

        <!-- Player Controls -->
        <div class="lesson-controls">
            <div class="control-group">
                <button id="btn-play" class="control-btn disabled" title="Play">
                    <i class="fas fa-play"></i>
                </button>
                <button id="btn-stop" class="control-btn disabled" title="Stop">
                    <i class="fas fa-step-backward"></i>
                </button>
            </div>

            <div class="lesson-progress">
                <span id="lesson-time">00:00</span>
                <span>/</span>
                <span id="lesson-duration">00:00</span>
            </div>

            <input type="range" id="progress-slider" class="control-slider" min="0" max="100" value="0">

            <div class="control-group">
                <button id="metronome-toggle" class="control-btn" title="Toggle Metronome">
                    <i class="fas fa-drum"></i>
                </button>
                <input type="range" id="speed-slider" class="control-slider" min="40" max="300" value="100" title="Speed">
            </div>

            <div class="control-group" style="margin-left: auto;">
                <button id="btn-toggle-complete" class="control-btn" title="Toggle Completion">
                    <i class="fas fa-check"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Get lesson ID from URL
         */
        function getLessonIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        /**
         * Format duration in seconds to MM:SS
         */
        function formatDuration(milliseconds) {
            let seconds = milliseconds / 1000;
            const minutes = (seconds / 60) | 0;
            seconds = (seconds - minutes * 60) | 0;
            return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
        }

        /**
         * Get current AlphaTab instance
         */
        function getAlphaTabInstance() {
            return alphaTabRenderer.currentScore;
        }

        /**
         * Load and display the lesson
         */
        async function loadLesson() {
            const lessonId = getLessonIdFromUrl();
            if (!lessonId) {
                document.getElementById('lesson-title').textContent = 'No lesson found';
                return;
            }

            try {
                // Load lesson details
                const lesson = lessonManager.getLessonDetails(lessonId);
                if (!lesson) {
                    document.getElementById('lesson-title').textContent = 'Lesson not found';
                    return;
                }

                // Load course info
                const course = courseManager.getCourseById(lesson.courseId);
                
                // Update header
                document.getElementById('lesson-title').textContent = lesson.title;
                document.getElementById('course-name').textContent = course?.title || 'Unknown Course';

                // Update status badge
                const progress = dataManager.getProgressByLesson(lessonId);
                if (progress?.completed) {
                    document.getElementById('lesson-status-badge').innerHTML = '<span class="complete-badge">✓ Completed</span>';
                } else {
                    document.getElementById('lesson-status-badge').textContent = 'In Progress';
                }

                // Render AlphaTex if present
                if (lesson.alphaTex) {
                    waitForAlphaTab(() => {
                        alphaTabRenderer.renderAlphaTex(lesson.alphaTex, 'lesson-alphatab');
                    });
                }

                // Setup player after AlphaTab loads
                setTimeout(setupPlayerControls, 1000);

            } catch (error) {
                console.error('Error loading lesson:', error);
                document.getElementById('lesson-title').textContent = 'Error loading lesson';
            }
        }

        /**
         * Wait for alphaTab library to be available
         */
        function waitForAlphaTab(callback, maxWait = 5000) {
            const startTime = Date.now();
            const checkInterval = setInterval(() => {
                if (typeof alphaTab !== 'undefined') {
                    clearInterval(checkInterval);
                    callback();
                } else if (Date.now() - startTime > maxWait) {
                    clearInterval(checkInterval);
                    console.error('AlphaTab library failed to load');
                }
            }, 50);
        }

        /**
         * Setup player controls
         */
        function setupPlayerControls() {
            const api = getAlphaTabInstance();
            if (!api) return;

            const playBtn = document.getElementById('btn-play');
            const stopBtn = document.getElementById('btn-stop');
            const metronomeToggle = document.getElementById('metronome-toggle');
            const speedSlider = document.getElementById('speed-slider');
            const progressSlider = document.getElementById('progress-slider');
            const timeDisplay = document.getElementById('lesson-time');
            const durationDisplay = document.getElementById('lesson-duration');
            const completeBtn = document.getElementById('btn-toggle-complete');
            const lessonId = getLessonIdFromUrl();

            // Enable buttons immediately - they should be ready
            playBtn.classList.remove('disabled');
            stopBtn.classList.remove('disabled');

            // Update button states based on player state
            if (api.playerStateChanged) {
                api.playerStateChanged.on((args) => {
                    const icon = playBtn.querySelector('i');
                    if (args.state === 0) {
                        icon.classList.remove('fa-pause');
                        icon.classList.add('fa-play');
                    } else {
                        icon.classList.remove('fa-play');
                        icon.classList.add('fa-pause');
                    }
                });
            }

            // Update time displays
            if (api.playerPositionChanged) {
                api.playerPositionChanged.on((args) => {
                    timeDisplay.textContent = formatDuration(args.currentTime);
                    durationDisplay.textContent = formatDuration(args.endTime);
                    if (args.endTime > 0) {
                        progressSlider.value = (args.currentTime / args.endTime) * 100;
                    }
                });
            }

            // Play/pause button
            playBtn.addEventListener('click', () => {
                if (!playBtn.classList.contains('disabled')) {
                    api.playPause();
                }
            });

            // Stop button
            stopBtn.addEventListener('click', () => {
                if (!stopBtn.classList.contains('disabled')) {
                    api.stop();
                }
            });

            // Metronome toggle
            metronomeToggle.addEventListener('click', () => {
                metronomeToggle.classList.toggle('active');
                api.metronomeVolume = metronomeToggle.classList.contains('active') ? 1 : 0;
            });

            // Speed slider
            speedSlider.addEventListener('input', (e) => {
                api.playbackSpeed = parseInt(e.target.value) / 100;
            });

            // Progress slider
            progressSlider.addEventListener('change', (e) => {
                const api = getAlphaTabInstance();
                if (api && api.playerPositionChanged) {
                    const percentage = parseFloat(e.target.value) / 100;
                    const newTime = (api.score?.duration || 0) * percentage;
                    if (newTime > 0) {
                        api.timePosition = newTime;
                    }
                }
            });

            // Complete button
            completeBtn.addEventListener('click', () => {
                const progress = dataManager.getProgressByLesson(lessonId);
                const isCompleted = progress?.completed || false;
                
                if (isCompleted) {
                    progressTracker.markLessonIncomplete(lessonId);
                } else {
                    progressTracker.markLessonCompleted(lessonId);
                }

                // Update badge
                const updatedProgress = dataManager.getProgressByLesson(lessonId);
                if (updatedProgress?.completed) {
                    document.getElementById('lesson-status-badge').innerHTML = '<span class="complete-badge">✓ Completed</span>';
                    completeBtn.classList.add('active');
                } else {
                    document.getElementById('lesson-status-badge').textContent = 'In Progress';
                    completeBtn.classList.remove('active');
                }
            });

            // Update complete button state
            const lesson = lessonManager.getLessonDetails(lessonId);
            const progress = dataManager.getProgressByLesson(lessonId);
            if (progress?.completed) {
                completeBtn.classList.add('active');
            }
        }

        // Load on page load
        window.addEventListener('load', loadLesson);
    </script>
</body>
</html>
